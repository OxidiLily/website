<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>OxidiLily — Portfolio</title>
    <meta name="description" content="Portfolio & digital store modern dengan interactive 3D physics ballpit, scroll velocity banner, serta halaman home, project, blog, shop, contact, dan about." />
    <meta name="keywords" content="portfolio, webgl, react bits, 3d physics, ballpit, design engineer, frontend, ui ux" />
    <meta name="author" content="OxidiLily" />
    <!-- Ikon situs. Hanya boleh ada SATU tag ikon: tanpa atribut `sizes` yang
         membedakan, browser memakai deklarasi TERAKHIR — jadi favicon SVG yang
         dulu berdiri di bawah baris ini selalu menang atas logo.png, dan
         itulah yang tampil di tab. Cadangan itu dibuang; logo.png ada di
         public/ dan disalin apa adanya oleh Vite, dan kalau sampai hilang
         browser cukup memakai ikon bawaannya sendiri.
         `site_favicon` di panel menimpanya saat halaman dimuat. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OxidiLily — Portfolio" />
    <meta property="og:description" content="Portfolio & digital store modern dengan interactive 3D physics ballpit, scroll velocity banner, serta halaman home, project, blog, shop, contact, dan about." />
    <meta property="og:site_name" content="OxidiLily" />
    <!-- og:image dan og:url wajib ada di HTML MENTAH: perayap kartu tautan
         (WhatsApp, Twitter, Slack) tidak menjalankan JavaScript, jadi nilai
         yang dipasang lib/seo.ts saat runtime tidak pernah mereka lihat.
         Nilai di sini adalah cadangan tingkat situs; halaman artikel
         menimpanya untuk pengunjung dan untuk perayap yang menjalankan JS. -->
    <meta property="og:image" content="/logo.png" />
    <meta property="og:url" content="/" />
    <link rel="canonical" href="/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OxidiLily — Portfolio" />
    <meta name="twitter:description" content="Portfolio & digital store modern dengan interactive 3D physics ballpit, scroll velocity banner, serta halaman home, project, blog, shop, contact, dan about." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font Google dimuat TANPA memblokir render. Stylesheet dengan
         media="print" tidak menahan parser maupun eksekusi skrip; main.tsx
         mengubahnya ke media="all" begitu aplikasi jalan, dan font menyusul
         saat tiba (display=swap). Sebelumnya rel="stylesheet" biasa: di
         jaringan yang IPv6-nya buntu, permintaan ke fonts.googleapis.com
         menggantung sampai batas waktu browser dan SELURUH situs ikut
         menggantung — root kosong, tanpa satu pun pesan error. Terukur di
         mesin ini: curl ke fonts.googleapis.com habis waktu 8 detik.
         Trik onload="this.media='all'" tidak bisa dipakai karena CSP menolak
         penangan event inline. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" media="print" data-font-tunda />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body class="bg-black text-white antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
