# Menjalankan situs desain-web sebagai container.
#
# Nilai environment di bawah diinterpolasi Compose dari berkas `.env` di
# direktori ini — berkas yang sama yang dipakai `npm run dev` — jadi tidak ada
# kunci yang ditulis dua kali dan tidak ada yang perlu disalin ke sini.
#
# Port host 3000 mungkin sudah dipegang unit systemd `desain-web.service` yang
# menjalankan `vite preview` langsung di host. Keduanya tidak bisa hidup
# bersama di port yang sama: matikan unit itu
# (`systemctl --user stop desain-web.service`), atau jalankan container ini di
# port lain dengan `WEB_PORT=3001 docker compose up -d`.
# Nama project dipatok eksplisit. Tanpa ini nama diturunkan dari nama folder
# ("website"), sementara panel Docker di linux-dashboard menjalankan stack ini
# dengan `-p web` — dua project berbeda untuk berkas compose yang sama. Karena
# satu container di sini memakai `container_name` tetap, keduanya berebut
# container yang sama: saat salah satunya membuat ulang network, container
# milik project lain masih menunjuk ID network lama dan `up` gagal dengan
# "failed to set up container networking: network ... not found".
name: web

services:
  # Otomatis sebelum web; akun lama tidak direset.
  # Terapkan schema.sql lalu require-password-change.sql sebelum deploy.
  # Urutan ketiga berkas SQL (termasuk migrate-public-to-web.sql) tidak lagi
  # penting: definisi web.is_admin() sengaja dibuat identik di ketiganya, dan
  # kesamaan itu dijaga scripts/is-admin.check.mjs. Sebelumnya menjalankan
  # schema.sql setelah migrasi mengembalikan versi yang tidak menuntut
  # penggantian password awal.
  admin-init:
    image: node:22.23.2-alpine3.24
    restart: 'no'
    user: node
    init: true
    # Secrets berbasis environment memerlukan filesystem tulis pada Compose lokal.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - ./scripts/create-admin.mjs:/app/create-admin.mjs:ro
    command: [node, /app/create-admin.mjs]
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_role_key
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - supabase_service_role_key
      - admin_password

  web:
    depends_on:
      admin-init:
        condition: service_completed_successfully
    build:
      context: .
      args:
        # Dipanggang ke dalam bundel — lihat komentar ARG di Dockerfile.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_AI_ORIGIN: ${VITE_AI_ORIGIN:-}
        SITE_URL: ${SITE_URL:-}
    image: desain-web:latest
    container_name: desain-web
    restart: unless-stopped
    # tini sebagai PID 1: sinyal stop diteruskan ke node dan proses yatim
    # dituai — tanpa ini `docker stop` menunggu 10 detik lalu membunuh paksa.
    init: true
    # Pengecil radius ledakan kalau ada yang berhasil masuk ke container:
    # tidak bisa menaikkan hak lewat setuid, dan tidak punya satu pun
    # capability kernel — server web memang tidak butuh apa pun.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Root filesystem SENGAJA tidak read-only: Vite menulis berkas sementara
    # di sebelah vite.config.ts saat mem-bundle-nya (lihat Dockerfile).
    # Batas sumber daya supaya satu proses liar tidak menyeret host.
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      # Dibaca SAAT JALAN oleh vite.config.ts sebagai sasaran proxy: browser
      # pengunjung memanggil origin situs ini, bukan Supabase atau gateway AI
      # secara langsung (lihat src/lib/apiBase.ts).
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_AI_ORIGIN: ${VITE_AI_ORIGIN:-}
      # Kunci gateway AI TIDAK ditaruh di sini. Nilai apa pun di `environment:`
      # — dan juga di `env_file:` — ikut tercetak utuh oleh
      # `docker compose config` dan `docker inspect`; terukur, keduanya bocor,
      # hanya `secrets:` yang tidak. Sekali salah satu perintah itu masuk log,
      # kuncinya bocor tanpa ada yang menyadarinya.
      #
      # Yang lewat sini cuma LOKASI berkasnya. Nilainya masuk sebagai secret di
      # bawah, dan vite.config.ts membacanya dari berkas itu.
      AI_API_KEY_FILE: /run/secrets/ai_api_key
      # AI_TRUST_PROXY SENGAJA tidak diisi di sini. Port 3000 dipublikasikan ke
      # host, jadi container ini juga bisa dihubungi langsung dengan header
      # X-Forwarded-For karangan klien sendiri. Isi `1` hanya kalau port itu
      # nanti ditutup dan seluruh lalu lintas lewat reverse proxy — lihat
      # penjelasannya di .env.example.
    secrets:
      - ai_api_key
    healthcheck:
      # wget ada di busybox milik image alpine, jadi tidak perlu menambah paket
      # apa pun hanya untuk pemeriksaan ini.
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

secrets:
  supabase_service_role_key:
    environment: SUPABASE_SERVICE_ROLE_KEY
  admin_password:
    environment: ADMIN_PASSWORD
  # Sumbernya tetap `AI_API_KEY` di berkas `.env` yang sama — tidak ada berkas
  # rahasia kedua yang harus dijaga tetap sinkron. Compose membacanya lalu
  # memasangnya sebagai berkas di dalam container; ia TIDAK pernah jadi
  # environment container, jadi tidak muncul di `docker inspect` maupun di
  # `docker compose config`.
  ai_api_key:
    environment: AI_API_KEY
